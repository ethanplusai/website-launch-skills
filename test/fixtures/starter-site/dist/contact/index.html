<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Harbour Skin Clinic</title>
  <meta name="description" content="Tell us what you are after and we will reply within a working day.">
  <link rel="canonical" href="https://starter.test/contact/">
</head>
<body>
  <main>
    <h1>Contact the practice</h1>
    <p>Tell us what you are after and we will reply within a working day.</p>
    <label>Your website <input type="url" name="website" placeholder="https://example.com"></label>
    <label>Your email <input type="email" name="reply" placeholder="you@example.com"></label>
    <form class="lead-form" data-endpoint="https://forms.starter.test/api/submit/REPLACE_WITH_FORM_ID" data-honeypot="_gotcha">
      <label><span>Name *</span><input type="text" name="name" required></label>
      <label><span>Email *</span><input type="email" name="email" required></label>
      <label><span>Message</span><textarea name="message" rows="5"></textarea></label>
      <button type="submit">Send</button>
    </form>
  </main>
</body>
</html>
