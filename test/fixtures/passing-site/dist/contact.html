<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Ridgeline Survey — request a parcel quote</title>
  <meta name="description" content="Send a parcel reference and a rough boundary and we will quote within two working days. Phone and postal address for the Kirkwall office.">
  <link rel="canonical" href="https://passing.test/contact">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <meta property="og:title" content="Contact Ridgeline Survey">
  <meta property="og:image" content="https://passing.test/og.png">
  <meta property="og:url" content="https://passing.test/contact">
</head>
<body>
  <header>
    <a href="/">Ridgeline Survey</a>
    <nav><a href="/about">About</a> <a href="/contact">Contact</a></nav>
  </header>
  <main>
    <h1>Request a parcel quote</h1>
    <form action="https://formspree.io/f/mnqeblpz" method="post">
      <label for="email">Your email</label>
      <input id="email" name="email" type="email" required>
      <label for="parcel">Parcel reference</label>
      <input id="parcel" name="parcel" type="text" required>
      <button type="submit">Send</button>
    </form>
    <p>Or call 01856 555 0134.</p>
  </main>
  <footer><p>Ridgeline Survey, Kirkwall.</p></footer>
</body>
</html>
